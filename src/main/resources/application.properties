spring.application.name=queryForge
spring.application.name=queryforge

# R2DBC - Reactive database connection
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/queryforge
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

# Flyway - JDBC migration connection
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/queryforge
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration